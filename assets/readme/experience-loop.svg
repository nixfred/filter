<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d"><title id="t">The Great Filter experience loop</title><desc id="d">Set six probabilities, run billions of modeled years, then read the Silence Report.</desc><rect width="1200" height="360" rx="28" fill="#080d18"/><text x="54" y="62" fill="#f4f0ff" font-family="Georgia,serif" font-size="32">Three steps into the silence</text><g font-family="system-ui,sans-serif"><g fill="#12172a" stroke="#9d7ae8" stroke-width="2"><rect x="55" y="105" width="310" height="185" rx="22"/><rect x="445" y="105" width="310" height="185" rx="22"/><rect x="835" y="105" width="310" height="185" rx="22"/></g><g fill="#a989ef" font-family="ui-monospace,monospace" font-size="18" font-weight="700"><text x="84" y="146">01 / CONFIGURE</text><text x="474" y="146">02 / SIMULATE</text><text x="864" y="146">03 / INTERPRET</text></g><g fill="#f5f2fa" font-size="27" font-weight="700"><text x="84" y="194">Set the odds</text><text x="474" y="194">Run a galaxy</text><text x="864" y="194">Read the silence</text></g><g fill="#9da9bf" font-size="18"><text x="84" y="230">Six visible controls</text><text x="474" y="230">Deterministic deep time</text><text x="864" y="230">Sentence first, metrics second</text><text x="84" y="258">Nine curated presets</text><text x="474" y="258">Worker powered playback</text><text x="864" y="258">Share the exact scenario</text></g></g><g stroke="#b996ff" stroke-width="4" fill="none"><path d="M380 197h48"/><path d="m414 183 14 14-14 14"/><path d="M770 197h48"/><path d="m804 183 14 14-14 14"/></g></svg>
