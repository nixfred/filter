<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d"><title id="t">Contact requires causal overlap</title><desc id="d">A signal must cross the distance while another civilization is capable of recognizing it; simultaneous existence alone is not contact.</desc><rect width="1200" height="400" rx="28" fill="#080d18"/><text x="55" y="62" fill="#f4f0ff" font-family="Georgia,serif" font-size="32">Alive at the same time is not enough.</text><line x1="170" y1="210" x2="1030" y2="210" stroke="#26334b" stroke-width="3"/><circle cx="210" cy="210" r="22" fill="#b996ff"/><circle cx="990" cy="210" r="22" fill="#5bc9e8"/><g fill="none" stroke="#9d7ae8" stroke-width="3" opacity=".85"><circle cx="210" cy="210" r="55"/><circle cx="210" cy="210" r="100"/><circle cx="210" cy="210" r="150"/></g><path d="M365 210h550" stroke="#b996ff" stroke-width="4" stroke-dasharray="12 12"/><path d="m900 194 18 16-18 16" fill="none" stroke="#b996ff" stroke-width="4"/><g font-family="system-ui,sans-serif"><text x="210" y="290" text-anchor="middle" fill="#e9e3f4" font-size="22" font-weight="700">TRANSMITTER</text><text x="990" y="290" text-anchor="middle" fill="#e9e3f4" font-size="22" font-weight="700">RECEIVER</text><text x="600" y="185" text-anchor="middle" fill="#aeb9ca" font-size="18">signal travels at light speed</text><text x="600" y="350" text-anchor="middle" fill="#8796ac" font-size="18">Contact fires only if the receiver is still recognition-capable when the signal arrives.</text></g></svg>
