<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="t d"><title id="t">Civilization state funnel</title><desc id="d">Candidate systems pass through habitability, life, intelligence, technology, detectability, and interstellar expansion, with fewer surviving each transition.</desc><rect width="1200" height="410" rx="28" fill="#080d18"/><text x="55" y="62" fill="#f4f0ff" font-family="Georgia,serif" font-size="32">Every light must pass a chain of filters.</text><g font-family="system-ui,sans-serif" text-anchor="middle"><path d="M72 111h1056l-145 235H217z" fill="#11172a" stroke="#66528f" stroke-width="2"/><g fill="none" stroke="#8065b6" stroke-width="2"><path d="M191 150h818"/><path d="M221 190h758"/><path d="M252 230h696"/><path d="M283 270h634"/><path d="M314 310h572"/></g><g fill="#d9d1e8" font-size="18" font-weight="650"><text x="600" y="140">CANDIDATE SYSTEMS</text><text x="600" y="180">HABITABLE WORLDS</text><text x="600" y="220">LIFE</text><text x="600" y="260">INTELLIGENCE</text><text x="600" y="300">TECHNOLOGY → DETECTABLE</text><text x="600" y="340" fill="#b996ff">INTERSTELLAR</text></g></g><text x="600" y="385" text-anchor="middle" fill="#8997ad" font-family="ui-monospace,monospace" font-size="17">The narrowest realized transition becomes the run’s descriptive “Great Filter.”</text></svg>
