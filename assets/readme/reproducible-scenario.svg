<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="t d"><title id="t">Reproducible scenario pipeline</title><desc id="d">Controls, advanced settings, seed, and model version are encoded into a share link that reproduces the same modeled history and report.</desc><rect width="1200" height="370" rx="28" fill="#080d18"/><text x="55" y="62" fill="#f4f0ff" font-family="Georgia,serif" font-size="32">Share a modeled history, not a screenshot.</text><g font-family="system-ui,sans-serif"><g fill="#12172a" stroke="#635183" stroke-width="2"><rect x="55" y="112" width="250" height="165" rx="20"/><rect x="475" y="112" width="250" height="165" rx="20"/><rect x="895" y="112" width="250" height="165" rx="20"/></g><g fill="#f1edf7" font-size="24" font-weight="700"><text x="82" y="160">Scenario state</text><text x="502" y="160">Share URL</text><text x="922" y="160">Same run</text></g><g fill="#95a3b8" font-size="18"><text x="82" y="198">controls + advanced</text><text x="82" y="226">seed + model version</text><text x="502" y="198">versioned encoding</text><text x="502" y="226">no account or server</text><text x="922" y="198">same events + digest</text><text x="922" y="226">same Silence Report</text></g></g><g stroke="#b996ff" stroke-width="4" fill="none"><path d="M325 195h125"/><path d="m436 181 14 14-14 14"/><path d="M745 195h125"/><path d="m856 181 14 14-14 14"/></g><text x="600" y="330" text-anchor="middle" fill="#8997ad" font-family="ui-monospace,monospace" font-size="17">deterministic by construction · private by default</text></svg>
