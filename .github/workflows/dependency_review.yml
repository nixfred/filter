# Block newly vulnerable dependencies at pull request time (SEC004,
# docs/CI_CD.md section 5.2, packet 03 section 7).
name: dependency_review

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json

permissions: {}

jobs:
  dependency_review:
    name: dependency_review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # High and above blocks by default (SEC004). A dated exception in
          # docs/DECISIONS.md is the only way past a finding.
          fail-on-severity: high
